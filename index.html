<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GShare & ADH Operational Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      background-color: #0e121a;
      background-image: 
        radial-gradient(at 0% 0%, hsla(216, 56%, 16%, 1) 0px, transparent 50%),
        radial-gradient(at 50% 100%, hsla(43, 86%, 53%, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, hsla(210, 40%, 10%, 1) 0px, transparent 50%);
      background-attachment: fixed;
      background-size: cover;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .badge {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .table-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 15px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .metric-value {
      font-weight: bold;
      font-size: 18px;
      color: #38bdf8;
    }

    .metric-value.highlight {
      color: #facc15;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .dot-pending { background-color: #f59e0b; }
    .dot-processing { background-color: #3b82f6; }
    .dot-processed { background-color: #10b981; }
    .dot-failed { background-color: #ef4444; }
    .dot-delivered { background-color: #facc15; }
  </style>
</head>
<body>

  <header>
    <h2>GShare & ADH Operational Dashboard</h2>
    <span class="badge">Platform Admin</span>
  </header>

  <main>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Metric Name</th>
            <th>Status Indicator</th>
            <th>Live Count</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Pending Orders</strong></td>
            <td><span class="status-dot dot-pending"></span>Pending</td>
            <td class="metric-value" id="pending-count">Loading...</td>
          </tr>
          <tr>
            <td><strong>Processing Orders</strong></td>
            <td><span class="status-dot dot-processing"></span>In Progress</td>
            <td class="metric-value" id="processing-count">Loading...</td>
          </tr>
          <tr>
            <td><strong>Processed Orders</strong></td>
            <td><span class="status-dot dot-processed"></span>Completed</td>
            <td class="metric-value highlight" id="processed-count">Loading...</td>
          </tr>
          <tr>
            <td><strong>Failed Orders</strong></td>
            <td><span class="status-dot dot-failed"></span>Failed</td>
            <td class="metric-value" id="failed-count">Loading...</td>
          </tr>
          <tr>
            <td><strong>Delivered Data (Beneficiaries)</strong></td>
            <td><span class="status-dot dot-delivered"></span>Total Delivered</td>
            <td class="metric-value highlight" id="total-beneficiaries">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function fetchAdminMetrics() {
      try {
        const response = await fetch('https://gshare-adh-portal.onrender.com/api/metrics');
        const data = await response.json();

        if (document.getElementById('pending-count')) document.getElementById('pending-count').innerText = data.pending;
        if (document.getElementById('processing-count')) document.getElementById('processing-count').innerText = data.processing;
        if (document.getElementById('processed-count')) document.getElementById('processed-count').innerText = data.processed;
        if (document.getElementById('failed-count')) document.getElementById('failed-count').innerText = data.failed;
        if (document.getElementById('total-beneficiaries')) document.getElementById('total-beneficiaries').innerText = data.totalBeneficiaries || data.total;
      } catch (error) {
        console.error("Error loading metrics:", error);
      }
    }

    fetchAdminMetrics();
    setInterval(fetchAdminMetrics, 10000);
  </script>
</body>
</html>
