<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GShare & ADH Operational Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .badge {
      background: #3d3b14;
      color: #e5c07b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .table-container {
      background: #1b263b;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 16px;
      border-bottom: 1px solid #2b3a4e;
    }
    th {
      color: #8d99ae;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .pending { background: #f39c12; }
    .processing { background: #3498db; }
    .completed { background: #2ecc71; }
    .failed { background: #e74c3c; }
    .total { background: #f1c40f; }
    .val-blue { color: #3498db; font-weight: bold; font-size: 18px; }
    .val-gold { color: #f1c40f; font-weight: bold; font-size: 18px; }
  </style>
  <script>
    async function updateMetrics() {
      try {
        const response = await fetch('/api/metrics');
        const data = await response.json();

        if (document.getElementById('pending-count')) {
          document.getElementById('pending-count').textContent = data.pending ?? 0;
        }
        if (document.getElementById('processing-count')) {
          document.getElementById('processing-count').textContent = data.processing ?? 0;
        }
        if (document.getElementById('completed-count')) {
          document.getElementById('completed-count').textContent = data.processed ?? 0;
        }
        if (document.getElementById('failed-count')) {
          document.getElementById('failed-count').textContent = data.failed ?? 0;
        }
        
        const totalElement = document.getElementById('total-count') || document.getElementById('total-delivered-count');
        if (totalElement) {
          totalElement.textContent = data.totalBeneficiaries ?? 0;
        }
      } catch (err) {
        console.error('Failed to load dashboard metrics:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateMetrics();
      setInterval(updateMetrics, 10000);
    });
  </script>
</head>
<body>
  <header>
    <h2>GShare & ADH Operational Dashboard</h2>
    <span class="badge">Platform Admin</span>
  </header>

  <main>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Metric Name</th>
            <th>Status Indicator</th>
            <th>Live Count</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Pending Orders</td>
            <td><span class="dot pending"></span>Pending</td>
            <td id="pending-count" class="val-blue">0</td>
          </tr>
          <tr>
            <td>Processing Orders</td>
            <td><span class="dot processing"></span>In Progress</td>
            <td id="processing-count" class="val-blue">0</td>
          </tr>
          <tr>
            <td>Processed Orders</td>
            <td><span class="dot completed"></span>Completed</td>
            <td id="completed-count" class="val-gold">0</td>
          </tr>
          <tr>
            <td>Failed Orders</td>
            <td><span class="dot failed"></span>Failed</td>
            <td id="failed-count" class="val-blue">0</td>
          </tr>
          <tr>
            <td>Delivered Data (Beneficiaries)</td>
            <td><span class="dot total"></span>Total Delivered</td>
            <td id="total-count" class="val-gold">0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
